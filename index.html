<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Accessible Lighthouse Test</title>
  </head>
  <body>
    <!-- ✅ Imagen con alt descriptivo -->
    <img src="https://via.placeholder.com/300" alt="Placeholder sample image" />

    <!-- ✅ Input con label asociado -->
    <form>
      <label for="name">Your name</label>
      <input id="name" type="text" name="name" />
    </form>

    <!-- ✅ Botón con texto accesible -->
    <button type="button">Submit</button>

    <!-- ✅ Contraste suficiente -->
    <p style="color: #222; background: #fff;">
      High contrast text
    </p>
  </body>
</html>
