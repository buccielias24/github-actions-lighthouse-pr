name: Lighthouse (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install LHCI and static server
        run: |
          npm i -g @lhci/cli
          npm i -g http-server

      - name: Start static server
        run: |
          http-server -p 8080 -c-1 . &
          sleep 2

      - name: Run Lighthouse CI (thresholds)
        run: lhci autorun --config=lighthouserc.json
